#root logger
# INFO, not DEBUG - the file should only carry: suite/browser launch
# details, suite started/finished banners, and per-test pass/fail/skip
# status (plus WARN/ERROR for real problems). Every other log.info(...)
# call across the framework (navigation confirmations, video/trace
# save paths, per-action clicks/types, etc.) was deliberately
# downgraded to log.debug(...) in the code so it's silenced by this
# level change instead of being logged and then filtered.
log4j.rootLogger = INFO, file
#appender
log4j.appender.file = org.apache.log4j.DailyRollingFileAppender
log4j.appender.file.File = Logs/PlaywrightProject.log
log4j.appender.file.rollingPolicy.FileNamePattern=automation-%d{yyyy-MM-dd}.log
log4j.appender.file.DatePattern='_'yyyy-MM-dd
#_HH-mm
#layout
log4j.appender.file.layout = org.apache.log4j.PatternLayout
log4j.appender.file.layout.ConversionPattern=%d d-- %m %n

#third-party noise suppression - root stays DEBUG for your own
#framework classes, these libraries are individually raised to WARN
log4j.logger.org.apache.poi=WARN
log4j.logger.freemarker=WARN