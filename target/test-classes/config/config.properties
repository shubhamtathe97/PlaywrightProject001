# Options: chromium | firefox | webkit
browser=chromium
headless=true 
# true for git hub action

Env=QA

# (one browser per class, reused for all its tests) and
# suites/PARALLEL_Methods.xml (fresh browser per test):
#   mvn test -DsuiteFile=src/test/resources/suites/STAGING.xml
#   mvn test -DsuiteFile=src/test/resources/suites/PARALLEL_Classes.xml -Dbrowser.lifecycle=CLASS
#   mvn test -DsuiteFile=src/test/resources/suites/PARALLEL_Methods.xml -Dbrowser.lifecycle=METHOD
#   mvn test -DsuiteFile=src/test/resources/suites/PARALLEL_Multibrowser.xml -Dbrowser.lifecycle=CLASS

browser.lifecycle=class

#video and trace enabled or disable during jenkin run
video.enabled=true
trace.enabled=true

# pick the matching client suite XML.
URL=https://rahulshettyacademy.com/AutomationPractice/

# report.title -> browser tab title
# report.name  -> the header/banner name at the top of the report
report.title=Automation Test Report
report.name=Playwright - Report

# Timeouts (milliseconds)
default.timeout=30000
page.load.timeout=60000

# Retry
retry.count=1