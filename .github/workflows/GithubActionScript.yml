name: Playwright Java Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  playwright-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Install Playwright browsers
        run: mvn -B exec:java -e -D exec.mainClass=com.microsoft.playwright.CLI -D exec.args="install --with-deps"

      # Your pom.xml reads the suite file from the property "suiteFile"
      # (NOT "suiteXmlFile"), so we pass the correct name here.
      # xvfb-run gives the browser a virtual display in case your code
      # launches it in headed mode.
      - name: Run TestNG Suite
        run: |
          set -o pipefail
          xvfb-run -a mvn -B clean test \
            -DsuiteFile=src/test/resources/suites/TestNg.xml \
            -DtrimStackTrace=false | tee maven-build.log

      - name: List generated report files
        if: always()
        run: |
          ls -la target/surefire-reports || true
          ls -la test-output || true

      - name: Upload Reports and Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestNG-Reports
          path: |
            target/surefire-reports/
            test-output/
            maven-build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Publish Test Results
        if: always()
        uses: dorny/test-reporter@v1
        continue-on-error: true
        with:
          name: TestNG Results
          path: target/surefire-reports/TEST-*.xml
          reporter: java-junit
          fail-on-error: false