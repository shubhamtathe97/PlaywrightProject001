name: Playwright Java Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  playwright-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Install Playwright browsers
        run: mvn -B exec:java -e -D exec.mainClass=com.microsoft.playwright.CLI -D exec.args="install --with-deps"

      - name: Run TestNG Suite
        run: |
          set -o pipefail
          xvfb-run -a mvn -B clean test \
            -DsuiteFile=src/test/resources/suites/TestNg.xml \
            -DtrimStackTrace=false | tee maven-build.log

      # Reads the real results (8 tests) written by your framework run
      # and shows them on the GitHub run page (Summary tab).
      - name: Show Real Test Results on Dashboard
        if: always()
        run: |
          python3 - <<'PY'
          import glob, os
          import xml.etree.ElementTree as ET

          out = os.environ["GITHUB_STEP_SUMMARY"]
          files = glob.glob("test-output/**/testng-results.xml", recursive=True)

          with open(out, "a", encoding="utf-8") as s:
              s.write("## Framework Test Results\n\n")
              if not files:
                  s.write("No testng-results.xml found in test-output/. "
                          "Download the Framework-Report artifact for details.\n")
              else:
                  root = ET.parse(files[0]).getroot()
                  total = root.get("total", "0")
                  passed = root.get("passed", "0")
                  failed = root.get("failed", "0")
                  skipped = root.get("skipped", "0")
                  icon = "✅" if failed == "0" else "❌"
                  s.write("| Total | Passed | Failed | Skipped |\n")
                  s.write("|:-----:|:------:|:------:|:-------:|\n")
                  s.write(f"| {total} | {passed} | {failed} | {skipped} |\n\n")
                  s.write(f"{icon} **{passed} of {total} tests passed**\n\n")

                  bad = []
                  for m in root.iter("test-method"):
                      if m.get("is-config") == "true":
                          continue
                      if m.get("status") in ("FAIL", "SKIP"):
                          bad.append((m.get("status"), m.get("name")))
                  if bad:
                      s.write("### Failed / Skipped tests\n\n")
                      for status, name in bad:
                          s.write(f"- **{status}** - `{name}`\n")
          PY

      # The only report folder that is uploaded: your framework report
      - name: Upload Framework Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Framework-Report
          path: |
            test-output/
            maven-build.log
          if-no-files-found: warn
          retention-days: 14