name: Playwright Java Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  playwright-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Install Playwright browsers
        run: mvn -B exec:java -e -D exec.mainClass=com.microsoft.playwright.CLI -D exec.args="install --with-deps"

      - name: Run TestNG Suite
        run: |
          set -o pipefail
          xvfb-run -a mvn -B clean test \
            -DsuiteFile=src/test/resources/suites/TestNg.xml \
            -DtrimStackTrace=false | tee maven-build.log

      - name: List generated report files
        if: always()
        run: |
          echo "--- test-output ---"
          find test-output -maxdepth 3 | head -100 || true

      # Your real report (Extent report with all 8 tests)
      - name: Upload Framework Report (test-output)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Framework-Report
          path: test-output/
          if-no-files-found: warn
          retention-days: 14

      # Maven wrapper results + build log
      - name: Upload Surefire Reports and Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Surefire-Reports
          path: |
            target/surefire-reports/
            maven-build.log
          if-no-files-found: warn
          retention-days: 14

      # Shows the REAL pass/fail counts (from the inner STAGING suite)
      # on the run page instead of the "1 failed" wrapper result.
      - name: Publish Real Test Results
        if: always()
        uses: dorny/test-reporter@v1
        continue-on-error: true
        with:
          name: Framework Test Results
          path: |
            test-output/junitreports/TEST-*.xml
            test-output/**/junitreports/TEST-*.xml
          reporter: java-junit
          fail-on-error: false