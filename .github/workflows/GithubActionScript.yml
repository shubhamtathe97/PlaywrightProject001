name: Playwright Java Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  playwright-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Install Playwright browsers
        run: mvn -B exec:java -e -D exec.mainClass=com.microsoft.playwright.CLI -D exec.args="install --with-deps"

      - name: Run TestNG Suite
        run: |
          set -o pipefail
          xvfb-run -a mvn -B clean test \
            -DsuiteFile=src/test/resources/suites/TestNg.xml \
            -DtrimStackTrace=false | tee maven-build.log

      - name: List generated files
        if: always()
        run: |
          echo "--- test-output ---"
          find test-output -maxdepth 4 -type f | head -200 || true

      # Finds the REAL suite results (ignores the executeClientSuite wrapper)
      - name: Show Real Test Results on Dashboard
        if: always()
        run: |
          python3 - <<'PY'
          import glob, os
          import xml.etree.ElementTree as ET

          WRAPPER = {"executeClientSuite"}
          candidates = []
          debug = []

          # 1) TestNG native results
          paths = glob.glob("test-output/**/testng-results.xml", recursive=True)
          paths += glob.glob("target/surefire-reports/**/testng-results.xml", recursive=True)
          for f in sorted(set(paths)):
              try:
                  root = ET.parse(f).getroot()
              except Exception as e:
                  debug.append((f, "unreadable: %s" % e))
                  continue
              ms = [(m.get("name"), m.get("status")) for m in root.iter("test-method")
                    if m.get("is-config") != "true"]
              names = {n for n, _ in ms}
              debug.append((f, "total=%s passed=%s failed=%s skipped=%s methods=%d" % (
                  root.get("total"), root.get("passed"), root.get("failed"),
                  root.get("skipped"), len(ms))))
              if names and names <= WRAPPER:
                  continue
              candidates.append({
                  "file": f,
                  "total": int(root.get("total", "0")),
                  "passed": int(root.get("passed", "0")),
                  "failed": int(root.get("failed", "0")),
                  "skipped": int(root.get("skipped", "0")),
                  "bad": [(s, n) for n, s in ms if s in ("FAIL", "SKIP")],
              })

          # 2) JUnit-style XML written by TestNG (test-output/junitreports)
          jt = jp = jf = js = 0
          jbad = []
          jfiles = glob.glob("test-output/**/junitreports/*.xml", recursive=True)
          for f in sorted(jfiles):
              try:
                  root = ET.parse(f).getroot()
              except Exception:
                  continue
              for tc in root.iter("testcase"):
                  name = tc.get("name")
                  if name in WRAPPER:
                      continue
                  jt += 1
                  if tc.find("failure") is not None or tc.find("error") is not None:
                      jf += 1
                      jbad.append(("FAIL", name))
                  elif tc.find("skipped") is not None:
                      js += 1
                      jbad.append(("SKIP", name))
                  else:
                      jp += 1
          if jt:
              debug.append(("junitreports (combined)", "total=%d passed=%d failed=%d skipped=%d" % (jt, jp, jf, js)))
              candidates.append({"file": "junitreports", "total": jt, "passed": jp,
                                 "failed": jf, "skipped": js, "bad": jbad})

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as s:
              s.write("## Framework Test Results\n\n")
              if candidates:
                  best = max(candidates, key=lambda c: c["total"])
                  icon = "✅" if best["failed"] == 0 else "❌"
                  s.write("| Total | Passed | Failed | Skipped |\n")
                  s.write("|:-----:|:------:|:------:|:-------:|\n")
                  s.write("| %d | %d | %d | %d |\n\n" % (
                      best["total"], best["passed"], best["failed"], best["skipped"]))
                  s.write("%s **%d of %d tests passed**\n\n" % (icon, best["passed"], best["total"]))
                  if best["bad"]:
                      s.write("### Failed / Skipped tests\n\n")
                      for status, name in best["bad"]:
                          s.write("- **%s** - `%s`\n" % (status, name))
                      s.write("\n")
              else:
                  s.write("⚠️ Real suite results were not found in a readable format. "
                          "See the debug list below and the Framework-Report artifact.\n\n")
              s.write("<details><summary>Debug: results files found</summary>\n\n")
              if debug:
                  for f, info in debug:
                      s.write("- `%s` - %s\n" % (f, info))
              else:
                  s.write("- none\n")
              s.write("\n</details>\n")
          PY

      - name: Upload Framework Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Framework-Report
          path: |
            test-output/
            maven-build.log
          if-no-files-found: warn
          retention-days: 14